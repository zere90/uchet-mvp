# Запуск PostgreSQL одной командой:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uchet
    ports:
       - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/create_test_db.sql:/docker-entrypoint-initdb.d/create_test_db.sql
volumes:
  pgdata:
